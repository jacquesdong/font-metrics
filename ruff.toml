# 本项目是 PEP 723 单文件脚本，没有 pyproject.toml，ruff 配置独立放这里。
# target-version 与脚本头部 requires-python = ">=3.8" 对齐。
target-version = "py38"

# 不用默认 88，脚本刻意保持 printf 风格的长 print 单行（最长行约 136），
# 让一条语句可被一次 grep 完整看到；ruff lint 与 format 共用此宽度。
line-length = 136

[format]

[lint]
# https://docs.astral.sh/ruff/rules/
#
# ruff 的默认规则集自 v0.1.0 起冻结了很久（59 条），但 v0.16.0（2026-07-23）
# 一次性扩到 413 条，新增一堆观点性检查，又丢掉一些语法检查。
# https://astral.sh/blog/ruff-v0.16.0
# 新版默认集含 UP/BLE/S 等（可使用 `just lint --isolated --statistics` 查看），
# 会把刻意统一的 % 格式化（UP031）报成问题，故不引入整个默认集。
# 扫描坏字体时原本吞掉的宽泛 except 现已改用 logger.debug(exc_info=True)
# 记录，因此把 BLE001/S112 两条以单码加入 select（不引入整个 BLE/S 前缀）。
select = ["E4", "E7", "E9", "F", "BLE001", "S112"]
